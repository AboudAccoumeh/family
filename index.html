<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Family Tree</title>
<meta name="description" content="An interactive family tree — explore every generation, profile, story and photo." />
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310b981'/%3E%3Cpath d='M16 25v-8m0 0-5-4m5 4 5-4' stroke='white' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='9' r='3' fill='white'/%3E%3Ccircle cx='9.5' cy='11.5' r='2.4' fill='white'/%3E%3Ccircle cx='22.5' cy='11.5' r='2.4' fill='white'/%3E%3C/svg%3E" />
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/grotesk-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
<script>
  /* apply the saved theme before first paint (no flash) */
  try { const t = localStorage.getItem('ft-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-view="tree">

<header id="topbar">
  <a class="brand" href="#" aria-label="Home">
    <span class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 21v-7m0 0-4.5-3.5M12 14l4.5-3.5"/><circle cx="12" cy="5.5" r="2.4" fill="currentColor" stroke="none"/><circle cx="6" cy="8.5" r="2" fill="currentColor" stroke="none"/><circle cx="18" cy="8.5" r="2" fill="currentColor" stroke="none"/></svg>
    </span>
    <span class="btext">
      <b id="brand-name">Family</b>
      <small id="brand-sub">Family tree</small>
    </span>
  </a>

  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-view="tree" class="on">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>
      <span>Tree</span>
    </button>
    <button data-view="people">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2A6.5 6.5 0 0 1 21.5 20"/></svg>
      <span>Members</span>
    </button>
    <button data-view="timeline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Timeline</span>
    </button>
  </nav>

  <div class="search" id="search-wrap">
    <svg class="s-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg>
    <input id="search" type="search" placeholder="Search name, job, city…" autocomplete="off" spellcheck="false" aria-label="Search family members" />
    <kbd class="s-kbd">/</kbd>
    <div id="results" role="listbox"></div>
  </div>

  <button class="icon-btn" id="btn-search-m" aria-label="Search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg>
  </button>
  <button class="icon-btn" id="btn-theme" aria-label="Toggle light / dark theme" title="Toggle theme">
    <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
  </button>
</header>

<!-- ============ TREE VIEW ============ -->
<main id="view-tree" class="view on">
  <div id="viewport" tabindex="0" aria-label="Family tree — drag to pan, scroll or pinch to zoom">
    <div id="world">
      <svg id="edges" aria-hidden="true"></svg>
      <div id="genlabels" aria-hidden="true"></div>
      <div id="cards"></div>
    </div>
  </div>

  <div class="hud" id="hud">
    <button id="btn-zin" title="Zoom in (+)" aria-label="Zoom in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <span id="zoompill">100%</span>
    <button id="btn-zout" title="Zoom out (−)" aria-label="Zoom out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <span class="hud-sep"></span>
    <button id="btn-fit" title="Fit to screen (0)" aria-label="Fit to screen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H4v5M15 3h5v5M9 21H4v-5M15 21h5v-5"/></svg>
    </button>
    <button id="btn-xall" title="Expand all branches" aria-label="Expand all">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
    </button>
    <button id="btn-call" title="Collapse all branches" aria-label="Collapse all">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20l5-5 5 5M7 4l5 5 5-5"/></svg>
    </button>
  </div>

  <div class="legend" id="legend" aria-hidden="true">
    <span><i class="lg-dot male"></i>Male</span>
    <span><i class="lg-dot female"></i>Female</span>
    <span><i class="lg-dot dec"></i>Deceased</span>
  </div>

  <div id="hint">
    <span class="h-desk">Drag to pan · Scroll to zoom · Click a person for details</span>
    <span class="h-mob">Drag to move · Pinch to zoom · Tap a person</span>
  </div>
</main>

<!-- ============ MEMBERS VIEW ============ -->
<main id="view-people" class="view page" aria-label="Family members">
  <div class="page-inner">
    <section class="hero-card">
      <div class="hero-text">
        <p class="eyebrow" id="hero-eyebrow">Family</p>
        <h1 id="hero-title">Family</h1>
        <p id="hero-tagline" class="muted"></p>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <div class="toolbar">
      <div class="chips" id="filters" role="group" aria-label="Filter">
        <button class="chip on" data-f="all">All</button>
        <button class="chip" data-f="living">Living</button>
        <button class="chip" data-f="deceased">Deceased</button>
        <button class="chip" data-f="male">Male</button>
        <button class="chip" data-f="female">Female</button>
      </div>
      <label class="sel">
        <span>Group by</span>
        <select id="groupby">
          <option value="gen">Generation</option>
          <option value="branch">Branch</option>
          <option value="place">Location</option>
          <option value="az">A – Z</option>
        </select>
      </label>
    </div>

    <div id="people-list"></div>
  </div>
</main>

<!-- ============ TIMELINE VIEW ============ -->
<main id="view-timeline" class="view page" aria-label="Family timeline">
  <div class="page-inner narrow">
    <header class="page-head">
      <p class="eyebrow">Through the years</p>
      <h1>Family timeline</h1>
      <p class="muted">Births, marriages, milestones and farewells — every dated moment, in order.</p>
    </header>
    <div id="family-timeline"></div>
  </div>
</main>

<!-- mobile bottom navigation -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Views">
  <button data-view="tree" class="on">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg>
    <span>Tree</span>
  </button>
  <button data-view="people">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2A6.5 6.5 0 0 1 21.5 20"/></svg>
    <span>Members</span>
  </button>
  <button data-view="timeline">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Timeline</span>
  </button>
</nav>

<!-- profile panel (side drawer on desktop, bottom sheet on mobile) -->
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Person details" role="dialog">
  <div class="grab" aria-hidden="true"></div>
  <button id="drawer-close" class="icon-btn" title="Close (Esc)" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="drawer-body"></div>
</aside>

<div id="lightbox" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<div id="loading">
  <span class="spinner"></span>
  <p>Loading family…</p>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
